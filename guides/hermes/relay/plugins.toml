version = 1

[[components]]
kind = "observability"
enabled = true

[components.config]
version = 4
enable_full_payloads = false

[components.config.opentelemetry]
enabled = true

[[components.config.opentelemetry.endpoints]]
type = "gen_ai"
transport = "http_binary"
endpoint = "http://otel-collector.openshell.svc.cluster.local:4318/v1/traces"
service_name = "hermes-openshell"
